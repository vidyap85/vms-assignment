server {
  listen 80;
  server_name _;
  client_max_body_size 100m;

  root /usr/share/nginx/html;
  index index.html;

  # React app (client-side routing)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO (websocket upgrade)
  location /socket.io/ {
    proxy_pass http://api:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
  }

  # HLS live streams from MediaMTX (strip the /hls prefix)
  location /hls/ {
    proxy_pass http://mediamtx:8888/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # MediaMTX's on-demand HLS muxer issues a self-referential "warm-up" redirect
    # (e.g. Location: /cam1/index.m3u8?cookieCheck=1) that doesn't know about the
    # /hls prefix we strip above. nginx auto-absolutizes that relative Location
    # using its own internal host inference, which drops the port (it does NOT
    # follow the Host header we set above) — so the replacement here has to spell
    # out the full "scheme://host:port" explicitly via $http_host, or the browser
    # ends up redirected to the wrong port and falls through to the SPA route
    # instead of back into this proxy, and hls.js loads index.html instead of the
    # playlist.
    proxy_redirect / $scheme://$http_host/hls/;
    add_header Cache-Control no-cache always;
  }

  # Recordings / snapshots / thumbnails, served directly from the shared media volume
  location /media/ {
    alias /media/;
    add_header Cache-Control "public, max-age=3600";
  }
}
